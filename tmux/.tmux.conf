# Change prefix to Ctrl+a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# General settings
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -g mouse on
set -g history-limit 10000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off

# Faster key repetition
set -s escape-time 0
set -g repeat-time 1000
set -g focus-events on

# Reload config with prefix + r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Vim-style pane navigation (prefix + h/j/k/l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vim-style pane resizing (repeat with prefix held)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Split panes while keeping the current directory
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Create new windows in the current directory
bind c new-window -c "#{pane_current_path}"

# Vim-style window navigation
bind -r C-h previous-window
bind -r C-l next-window

unbind f
bind f display-popup -E '~/.local/bin/tmux-sessionizer'

# Vim-style copy mode
setw -g mode-keys vi

# Enter copy mode with prefix + [
# Use v to begin selection and y to copy
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi r send-keys -X rectangle-toggle

# Clipboard integration (OSC 52 / terminal clipboard)
set -g set-clipboard on

# Status bar refresh
set -g status-interval 5

# TPM - Tmux Plugin Manager
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Continuum: automatic session saving and restoration
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

# Resurrect: save pane contents and Vim/Neovim sessions where possible
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'

# Initialize TPM (keep this at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
